<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Resume Analyzer</title>
    <!-- Telegram Web App SDK (обязательно) -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            margin: 0;
            padding: 16px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            box-sizing: border-box;
        }
        .button {
            background: var(--tg-theme-button-color, #40a7e3);
            color: var(--tg-theme-button-text-color, #ffffff);
            border: none;
            border-radius: 12px;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            width: 100%;
            max-width: 300px;
            transition: opacity 0.2s;
        }
        .button:hover {
            opacity: 0.9;
        }
        .debug {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: #ffeb3b;
            color: #000;
            padding: 8px;
            font-size: 11px;
            font-family: monospace;
            white-space: pre-wrap;
            word-break: break-word;
            border-top: 1px solid #000;
            max-height: 30vh;
            overflow-y: auto;
            z-index: 9999;
        }
    </style>
</head>
<body>
    <!-- Кнопка всегда видима, без скрытия -->
    <button class="button" id="sendBtn">✅ Активировать бота</button>

    <script>
        (function() {
            // ========== 1. Инициализация Telegram Web App ==========
            const tg = window.Telegram?.WebApp;
            if (tg) {
                tg.ready();
                tg.expand();
            }

            // ========== 2. Получение payload из URL ==========
            const urlParams = new URLSearchParams(window.location.search);
            let payload = urlParams.get('startapp') || 'unknown';

            // ========== 3. Формирование данных для отправки ==========
            const data = JSON.stringify({
                payload: payload,
                action: 'start',
                timestamp: Math.floor(Date.now() / 1000)
            });

            // ========== 4. Обработчик клика по кнопке ==========
            function handleClick() {
                if (tg) {
                    tg.sendData(data);
                    tg.close();
                } else {
                    alert('Ошибка: Telegram Web App SDK не загружен');
                }
            }

            // Назначаем обработчик
            const btn = document.getElementById('sendBtn');
            if (btn) {
                btn.addEventListener('click', handleClick);
            }

            // ========== 5. Отладочная панель (видна всегда) ==========
            function addDebug() {
                const debugDiv = document.createElement('div');
                debugDiv.className = 'debug';
                let log = '';
                log += '🔍 SDK: ' + (tg ? '✅' : '❌') + '\n';
                log += '📦 payload: ' + payload + '\n';
                log += '🆔 startapp: ' + (urlParams.get('startapp') || 'не указан') + '\n';
                log += '🔘 кнопка: ' + (btn ? '✅' : '❌') + '\n';
                log += '📤 данные: ' + data;
                debugDiv.innerText = log;
                document.body.appendChild(debugDiv);
                
                // Также в консоль
                console.log('[Mini App]', { tg: !!tg, payload, data });
            }

            // Добавляем отладку после полной загрузки DOM
            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', addDebug);
            } else {
                addDebug();
            }
        })();
    </script>
</body>
</html>
