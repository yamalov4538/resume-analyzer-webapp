<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body style="display: flex; flex-direction: column; align-items: center; padding: 20px;">
    <button id="sendBtn" style="background: #40a7e3; color: white; border: none; border-radius: 12px; padding: 12px 24px; font-size: 16px;">
        ✅ Активировать бота
    </button>
    <div id="debug" style="margin-top: 20px; padding: 10px; background: #f0f0f0; border-radius: 8px; font-family: monospace; white-space: pre-wrap;"></div>

    <script>
        // 1. Инициализация
        const tg = Telegram.WebApp;
        tg.ready();

        // 2. Получаем параметр startapp
        const urlParams = new URLSearchParams(window.location.search);
        const payload = urlParams.get('startapp') || 'unknown';

        // 3. Показываем отладку
        document.getElementById('debug').innerText = 'payload: ' + payload;

        // 4. Отправка при клике
        document.getElementById('sendBtn').onclick = function() {
            const data = JSON.stringify({ payload: payload, action: 'start' });
            tg.sendData(data);
            tg.close();
        };
    </script>
</body>
</html>
