<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <!-- Запрет кэширования (GitHub Pages может кэшировать) -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Resume Analyzer</title>
    <!-- Telegram Web App SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            margin: 0;
            padding: 16px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            box-sizing: border-box;
        }
        .message {
            text-align: center;
            font-size: 16px;
            line-height: 1.5;
            color: var(--tg-theme-hint-color, #999999);
            margin-bottom: 24px;
        }
        .button {
            background: var(--tg-theme-button-color, #40a7e3);
            color: var(--tg-theme-button-text-color, #ffffff);
            border: none;
            border-radius: 12px;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: opacity 0.2s;
            width: 100%;
            max-width: 300px;
        }
        .button:hover {
            opacity: 0.9;
        }
        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div class="message" id="status">🔄 Подготовка...</div>
    <button class="button hidden" id="sendBtn">✅ Активировать бота</button>

    <script>
        (function() {
            // 1. Инициализация Web App
            const tg = window.Telegram.WebApp;
            tg.ready();
            tg.expand(); // опционально

            // 2. Извлечение payload из URL
            const urlParams = new URLSearchParams(window.location.search);
            let payload = urlParams.get('startapp') || 'unknown';

            // 3. Формирование данных для отправки
            const data = JSON.stringify({
                payload: payload,
                action: 'start',
                timestamp: Math.floor(Date.now() / 1000)
            });

            // 4. Прячем сообщение о загрузке, показываем кнопку
            document.getElementById('status').classList.add('hidden');
            const btn = document.getElementById('sendBtn');
            btn.classList.remove('hidden');

            // 5. Обработчик нажатия кнопки
            btn.addEventListener('click', function() {
                // Отправляем данные в бота
                tg.sendData(data);
                // Закрываем Mini App
                tg.close();
            });
        })();
    </script>
</body>
</html>
