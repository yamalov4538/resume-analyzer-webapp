<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <!-- Запрет кэширования (GitHub Pages может кэшировать) -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Resume Analyzer</title>
    <!-- Telegram Web App SDK (синхронная загрузка) -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            margin: 0;
            padding: 16px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            box-sizing: border-box;
        }
        .message {
            text-align: center;
            font-size: 16px;
            line-height: 1.5;
            color: var(--tg-theme-hint-color, #999999);
            margin-bottom: 24px;
        }
        .button {
            background: var(--tg-theme-button-color, #40a7e3);
            color: var(--tg-theme-button-text-color, #ffffff);
            border: none;
            border-radius: 12px;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: opacity 0.2s;
            width: 100%;
            max-width: 300px;
        }
        .button:hover {
            opacity: 0.9;
        }
        .hidden {
            display: none;
        }
        /* Стили для отладочной панели – будет видна только если включена */
        .debug-panel {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: #ffeb3b;
            color: #000;
            padding: 10px;
            font-size: 12px;
            font-family: monospace;
            white-space: pre-wrap;
            word-break: break-word;
            z-index: 10000;
            border-top: 2px solid #000;
            max-height: 40vh;
            overflow-y: auto;
        }
    </style>
</head>
<body>
    <div class="message" id="status">🔄 Подготовка...</div>
    <button class="button hidden" id="sendBtn">✅ Активировать бота</button>

    <script>
        (function() {
            // ========== ОСНОВНАЯ ЛОГИКА MINI APP (ПО ТЗ) ==========
            const tg = window.Telegram?.WebApp;
            
            // Если SDK загрузился – инициализируем
            if (tg) {
                tg.ready();
                tg.expand();
            }

            // Извлечение payload из URL
            const urlParams = new URLSearchParams(window.location.search);
            let payload = urlParams.get('startapp') || 'unknown';

            // Формирование данных для отправки
            const data = JSON.stringify({
                payload: payload,
                action: 'start',
                timestamp: Math.floor(Date.now() / 1000)
            });

            // Функция показа кнопки и скрытия статуса
            function showUI() {
                const statusEl = document.getElementById('status');
                const btnEl = document.getElementById('sendBtn');
                if (statusEl) statusEl.classList.add('hidden');
                if (btnEl) btnEl.classList.remove('hidden');
            }

            // Обработчик нажатия кнопки
            function attachHandler() {
                const btn = document.getElementById('sendBtn');
                if (btn) {
                    btn.addEventListener('click', function() {
                        if (tg) {
                            tg.sendData(data);
                            tg.close();
                        } else {
                            alert('Ошибка: Telegram Web App SDK не загружен');
                        }
                    });
                }
            }

            // Если SDK готов сразу – показываем UI, иначе ждём
            if (tg) {
                showUI();
                attachHandler();
            } else {
                // Редкий случай, но можно подстраховаться
                window.addEventListener('load', function() {
                    // Повторная проверка после загрузки страницы
                    if (window.Telegram?.WebApp) {
                        const tg2 = window.Telegram.WebApp;
                        tg2.ready();
                        tg2.expand();
                        showUI();
                        attachHandler();
                    }
                });
            }

            // ========== ОТЛАДОЧНАЯ ПАНЕЛЬ ==========
            // Будет показывать состояние системы прямо на экране
            function addDebugPanel() {
                // Удаляем старую панель, если есть
                const oldPanel = document.getElementById('debugPanel');
                if (oldPanel) oldPanel.remove();

                const panel = document.createElement('div');
                panel.id = 'debugPanel';
                panel.className = 'debug-panel';
                
                let log = '';
                log += '🔍 ОТЛАДКА MINI APP\n';
                log += '-------------------\n';
                
                // 1. Проверка Telegram SDK
                log += '1. window.Telegram: ' + (window.Telegram ? '✅' : '❌') + '\n';
                if (window.Telegram) {
                    log += '2. window.Telegram.WebApp: ' + (window.Telegram.WebApp ? '✅' : '❌') + '\n';
                } else {
                    log += '2. window.Telegram.WebApp: ❌ (нет Telegram)\n';
                }

                // 2. Состояние SDK
                if (window.Telegram?.WebApp) {
                    const w = window.Telegram.WebApp;
                    log += '3. version: ' + (w.version || 'unknown') + '\n';
                    log += '4. platform: ' + (w.platform || 'unknown') + '\n';
                    log += '5. initData: ' + (w.initData ? 'присутствует' : 'отсутствует') + '\n';
                    log += '6. colorScheme: ' + (w.colorScheme || 'unknown') + '\n';
                }

                // 3. Параметры URL
                log += '7. startapp: ' + (payload || 'не указан') + '\n';
                
                // 4. Элементы DOM
                const statusEl = document.getElementById('status');
                const btnEl = document.getElementById('sendBtn');
                log += '8. status element: ' + (statusEl ? '✅' : '❌') + '\n';
                log += '9. button element: ' + (btnEl ? '✅' : '❌') + '\n';
                if (btnEl) {
                    log += '10. button classes: ' + btnEl.className + '\n';
                    log += '11. button hidden? ' + (btnEl.classList.contains('hidden') ? 'да (скрыта)' : 'нет (видна)') + '\n';
                }

                // 5. Размеры окна
                log += '12. viewport: ' + window.innerWidth + 'x' + window.innerHeight + '\n';

                // 6. Данные для отправки
                log += '13. data to send: ' + data + '\n';

                panel.innerText = log;
                document.body.appendChild(panel);
            }

            // Показываем отладку сразу после загрузки DOM
            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', addDebugPanel);
            } else {
                addDebugPanel();
            }

            // Также дублируем в консоль браузера
            console.log('🔍 DEBUG INFO:', {
                telegram: !!window.Telegram,
                webapp: !!window.Telegram?.WebApp,
                payload: payload,
                statusEl: !!document.getElementById('status'),
                btnEl: !!document.getElementById('sendBtn'),
                data: data
            });

        })();
    </script>
</body>
</html>
