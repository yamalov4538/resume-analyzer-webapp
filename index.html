<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Resume Analyzer</title>
    <!-- Telegram Web App SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            margin: 0;
            padding: 16px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            box-sizing: border-box;
        }
        .message {
            text-align: center;
            font-size: 16px;
            line-height: 1.5;
            color: var(--tg-theme-hint-color, #999999);
        }
    </style>
</head>
<body>
    <div class="message">🔄 Перенаправление в бота...</div>

    <script>
        (function() {
            // 1. Инициализация Web App
            const tg = window.Telegram.WebApp;
            tg.ready();
            tg.expand(); // растягиваем на весь экран (необязательно, но красиво)

            // 2. Извлечение payload из URL
            const urlParams = new URLSearchParams(window.location.search);
            let payload = urlParams.get('startapp') || 'unknown';

            // 3. Формирование данных для отправки
            const data = JSON.stringify({
                payload: payload,
                action: 'start',
                timestamp: Math.floor(Date.now() / 1000)
            });

            // 4. Отправка данных в бота
            tg.sendData(data);

            // 5. Закрытие Web App
            tg.close();
        })();
    </script>
</body>
</html>
